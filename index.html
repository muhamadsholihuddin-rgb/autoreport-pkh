<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f11;--surf:#161b22;--surfhi:#1c2128;
  --bd:#21262d;--bd2:#30363d;
  --tx:#f0f6fc;--txs:#cdd9e5;--txm:#8b949e;
  --gold:#d4a853;--goldDim:rgba(212,168,83,0.12);--goldBd:rgba(212,168,83,0.28);
}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:99px}
input,select,textarea{font-family:inherit;background:#0d1117;border:1px solid var(--bd2);color:var(--tx);border-radius:8px;padding:9px 12px;font-size:12px;outline:none;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select{appearance:none;padding-right:32px;cursor:pointer}
select option{background:#161b22}
textarea{resize:vertical;line-height:1.7}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5);cursor:pointer}
input[type=range]{accent-color:var(--gold);cursor:pointer}
label.photo-slot{display:block;position:relative;background:#0d1117;border:1.5px dashed var(--bd2);border-radius:8px;cursor:pointer;overflow:hidden;aspect-ratio:16/9;transition:border-color .15s}
label.photo-slot:hover{border-color:var(--gold)}
label.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
label.photo-slot .ph-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--txm)}
label.photo-slot .ph-del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);border:none;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
label.kop-slot{aspect-ratio:5/1}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:20px}
.sec-hd{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px}
.lbl{font-size:10px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:12px}
.divider{height:1px;background:var(--bd);margin:14px 0}
.btn-gold{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--gold),#8a5c10);color:#0d0f11;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-gold:disabled{opacity:.65;cursor:not-allowed}
.btn-out{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--bd2);background:transparent;color:var(--txs);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--goldBd);background:var(--goldDim);color:var(--gold);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.tab-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-family:inherit;background:transparent;color:var(--txm);font-size:11px;font-weight:600;transition:all .15s}
.tab-btn.active{background:var(--goldDim);color:var(--gold)}
.side-tab{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--txm);font-size:11px;font-weight:600;text-align:left;transition:all .15s;border-left:2px solid transparent;font-family:inherit}
.side-tab.active{background:var(--goldDim);color:var(--gold);border-left-color:var(--gold)}
.side-tab:hover{color:var(--txs)}
.rhk-card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;transition:all .16s}
.rhk-card:hover,.rhk-card.active{border-color:var(--gold);background:var(--surfhi)}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.fi{animation:fadein .22s ease}
.spin-ico{display:inline-flex;width:14px;height:14px;animation:spin .8s linear infinite}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--goldBd);color:var(--gold);padding:10px 22px;border-radius:99px;font-size:12px;font-weight:600;z-index:999;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fadein .22s ease;white-space:nowrap}
.toast.err{border-color:#f85149;color:#f85149}
/* A4 document */
#doc-preview{width:210mm;min-height:297mm;background:white;color:#111;padding:1.5cm 2cm;margin:0 auto;font-family:'Times New Roman',serif;line-height:1.5;box-shadow:0 24px 80px rgba(0,0,0,.6);border-radius:4px}
.doc-sec-title{font-weight:bold;margin-bottom:6px;text-align:left}
.doc-sec{margin-bottom:14px;page-break-inside:avoid;break-inside:avoid}
.doc-sec-body{margin-left:0}
/* subheading tidak boleh ditinggal sendirian di akhir halaman */
.doc-subhd{font-weight:bold;font-style:normal;text-decoration:underline;margin-bottom:2px;page-break-after:avoid;break-after:avoid}
/* paragraf isi: spasi 1,5 — justify — hanging indent untuk numbered list */
.doc-para{text-align:justify;white-space:pre-wrap;line-height:1.5;margin-bottom:6px}
.doc-num-wrap{display:table;width:100%;margin-bottom:4px}
.doc-num-no{display:table-cell;width:1.6em;vertical-align:top;font-weight:normal}
.doc-num-txt{display:table-cell;text-align:justify;line-height:1.5;vertical-align:top}
.info-table{border-collapse:collapse;border:none;width:100%}
.info-table td{border:none;padding-bottom:3px;vertical-align:top;line-height:1.5}
.info-table td:first-child{width:130px;font-weight:bold}
@media(max-width:860px){
  #sidebar{display:none!important}
  .preview-panel{display:none}
  main{padding:14px!important;padding-bottom:calc(74px + env(safe-area-inset-bottom))!important}
  #mob-nav{padding-bottom:calc(6px + env(safe-area-inset-bottom))!important}
  .card{padding:16px}
}
.btn-share{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--goldBd);background:transparent;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
@media print{
  @page{size:A4;margin:1.5cm 2cm}
  /* Hilangkan header/footer browser (url, tanggal, jam) */
  @page{margin-top:1.5cm;margin-bottom:1.5cm;margin-left:2cm;margin-right:2cm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:white!important;margin:0;padding:0}
  #app-shell{display:none!important}
  #print-wrap{display:block!important}
  #doc-preview{width:100%!important;min-height:unset!important;padding:0!important;margin:0!important;box-shadow:none!important;border-radius:0!important;line-height:1.5!important}
  .doc-sec{page-break-inside:avoid;break-inside:avoid}
  .doc-sec-title{page-break-after:avoid;break-after:avoid}
  .doc-subhd{page-break-after:avoid;break-after:avoid}
  p,li,.doc-num-wrap{orphans:3;widows:3}
  li{page-break-inside:avoid;break-inside:avoid}
  table{page-break-inside:avoid;break-inside:avoid}
  img{page-break-inside:avoid;break-inside:avoid;max-width:100%}
  .page-break{page-break-before:always;break-before:always}
  /* Lampiran: judul harus nempel langsung di atas foto */
  #doc-preview > div:last-child { page-break-before:always; break-before:always; }
  /* Seksi A. Pendahuluan tetap di halaman 1 bersama judul */
  .doc-pendahuluan{page-break-before:avoid;break-before:avoid}
}
.select-wrap{position:relative}
.select-wrap::after{content:'›';position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(90deg);pointer-events:none;color:var(--txm);font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<div id="print-wrap" style="display:none"></div>

<script type="module">
// ── DATA ──────────────────────────────────────
const P2K2 = {
  "Modul 1: Pendidikan & Pengasuhan Anak":["Sesi 1: Menjadi Orang Tua yang Lebih Baik","Sesi 2: Memahami Perilaku Anak","Sesi 3: Cara Anak Usia Dini Belajar","Sesi 4: Membantu Anak Sukses di Sekolah"],
  "Modul 2: Ekonomi & Keuangan":["Sesi 5: Mengelola Keuangan Keluarga","Sesi 6: Cermat Meminjam dan Menabung","Sesi 7: Memulai Usaha"],
  "Modul 3: Kesehatan & Gizi":["Sesi 8: Gizi & Layanan Ibu Hamil","Sesi 9: Gizi untuk Ibu Menyusui & Balita","Sesi 10: Kesakitan Anak & Kebersihan Lingkungan"],
  "Modul 4: Perlindungan Anak":["Sesi 11: Pencegahan Kekerasan pada Anak","Sesi 12: Penelantaran & Eksploitasi Anak"],
  "Modul 5: Kesejahteraan Sosial":["Sesi 13: Pelayanan Penyandang Disabilitas Berat","Sesi 14: Kesejahteraan Lanjut Usia"]
};
const RHK = [
  {id:1,no:1,title:"Penyaluran Bansos PKH",sub:"Tepat Sasaran & Jumlah",options:["Edukasi & sosialisasi pencairan tunai/non-tunai","Supervisi permasalahan bantuan sosial","Monitoring/Pemantauan penyaluran bantuan sosial"]},
  {id:2,no:2,title:"Pertemuan P2K2",sub:"Sesuai Ketentuan",options:["Melaksanakan Pertemuan P2K2 (FDS)"]},
  {id:3,no:3,title:"Verifikasi Komitmen",sub:"& Pendampingan KPM",options:["Verifikasi komitmen pendidikan, kesehatan & kesos","Pendampingan, mediasi, dan fasilitasi KPM PKH"]},
  {id:4,no:4,title:"Usulan Graduasi & PPSE",sub:"Pemberdayaan Ekonomi",options:["Usulan KPM graduasi mandiri","Pemberdayaan PPSE (usulan PPSE)"]},
  {id:5,no:5,title:"VerVal & Pemutakhiran",sub:"Data KPM",options:["Proses bisnis PKH (VerVal)","Pemutakhiran data anggota KPM"]},
  {id:6,no:6,title:"Respon Kasus Adaptif",sub:"Cepat & Terukur",options:["Respon kasus/pengaduan/kebencanaan/kerentanan"]},
  {id:7,no:7,title:"Laporan Bulanan",sub:"Analisis & Dokumentasi",options:["Laporan bulanan pelaksanaan PKH & laporan lainnya"]},
  {id:8,no:8,title:"Direktif Pimpinan",sub:"Sesuai Penugasan",options:["TLHP (Tindak Lanjut Hasil Pemeriksaan)","Sosialisasi kebijakan","Rapat Koordinasi","Tugas lainnya"]},
  {id:9,no:9,title:"Berita Baik Kemensos",sub:"Komunikasi Publik",options:["Penyebaran Berita Baik di Media Sosial"]}
];

// ── HELPERS ──────────────────────────────────
const toDate = d => d ? new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(d)) : "";
const lastWorkday = () => {
  // Hari kerja terakhir bulan berjalan (Senin=1 s/d Jumat=5)
  const n=new Date(), ld=new Date(n.getFullYear(),n.getMonth()+1,0);
  // Mundur sampai ketemu hari kerja (bukan Sabtu=6, bukan Minggu=0)
  while(ld.getDay()===0 || ld.getDay()===6) ld.setDate(ld.getDate()-1);
  return new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"long",year:"numeric"}).format(ld);
};
const today = () => new Date().toISOString().split("T")[0];

// ── DASAR KEGIATAN DINAMIS ──────────────────
function getDasar(rhk, f, modul, sesi) {
  const base = [
    `Rencana Hasil Kerja (RHK) ASN PPPK Dit. PSNK terkait ${rhk.title} — ${rhk.sub}.`,
    `Tugas pokok ASN PPPK Dit. PSNK di wilayah tugas guna menjamin keberlangsungan program perlindungan sosial nasional.`
  ];
  const sp = {
    1:`Data Bayar dan Monitoring Penyaluran Bantuan Sosial yang bersumber dari SIKMA/Omspan periode berjalan sebagai acuan distribusi tepat sasaran.`,
    2:`Kurikulum Modul P2K2 Direktorat Jaminan Sosial Keluarga — ${modul}: ${sesi} — sebagai pedoman pelaksanaan pertemuan.`,
    3:`Sistem Verifikasi Komitmen (VerKom) yang terintegrasi pada aplikasi SIKMA guna menjamin bantuan tepat syarat.`,
    4:f.kegiatan?.toLowerCase().includes("ppse")?`Instrumen Asesmen KPM Potensi Graduasi dan Formulir Pendaftaran Program PPSE Kemensos RI.`:`Pedoman Graduasi Mandiri PKH dan Instrumen Asesmen Kesiapan Ekonomi Keluarga guna akurasi data kepesertaan.`,
    5:`Data Pembaruan DTSEN yang bersumber dari SIKMA guna menjamin akuntabilitas data penerima bantuan sosial nasional.`,
    6:`Mekanisme Respons Cepat Kasus Sosial PKH dan prosedur penanganan pengaduan yang ditetapkan Kemensos RI.`,
    7:`Format Laporan Bulanan Pelaksanaan PKH yang ditetapkan Direktorat PSNK sebagai instrumen monitoring kinerja periodik.`,
    8:`Instruksi strategis dan direktif pimpinan Direktorat PSNK Kemensos RI yang bersifat mengikat dan memerlukan tindak lanjut segera.`,
    9:`Panduan Komunikasi Publik Kemensos RI melalui kanal digital resmi.`
  };
  return [...base, sp[rhk.no]||sp[9]];
}

// ── NARRATIVE BUILDER ────────────────────────
// Flag: jika user sudah edit narasi secara manual, auto-fill tidak override
let _narasiManual = false;

function buildNarrative(rhk, f, modul, sesi) {
  const desa=f.desa||"...", grp=f.kelompok||"...", sasaran=f.sasaran||"...", act=f.kegiatan||"";
  const isPPSE = act.toLowerCase().includes("ppse");
  let umum,tujuan,narasi,hasil;
  switch(rhk.no){
    case 1:
      umum=`Penyaluran bantuan sosial merupakan pilar strategis dalam menjaga jaring pengaman sosial nasional bagi masyarakat prasejahtera di Indonesia. Dalam kerangka Program Keluarga Harapan (PKH), ketepatan jumlah dan waktu penyaluran sangat krusial untuk menjaga daya beli serta memenuhi kebutuhan dasar Keluarga Penerima Manfaat (KPM) secara akuntabel dan transparan sesuai regulasi Kemensos RI.`;
      tujuan=`1. Meningkatkan literasi finansial KPM mengenai mekanisme transaksi bantuan sosial melalui mesin ATM maupun agen perbankan resmi di wilayah Desa ${desa}.\n2. Memastikan KPM menerima bantuan sesuai komponen hak tanpa adanya potongan ilegal dari pihak manapun.\n3. Mengedukasi KPM agar senantiasa menjaga kerahasiaan PIN Kartu KKS masing-masing guna menghindari penyalahgunaan dana.`;
      narasi=`Pendamping sosial melaksanakan pendampingan teknis dan edukasi pencairan bantuan di lokasi transaksi secara intensif. Diberikan arahan komprehensif mengenai tata cara penggunaan kartu KKS yang benar, membantu KPM yang mengalami kendala teknis pada mesin transaksi, serta melakukan verifikasi saldo untuk memastikan dana telah masuk ke rekening masing-masing KPM. Pendamping juga memberikan motivasi agar bantuan digunakan secara bijak untuk kebutuhan prioritas seperti pendidikan anak dan asupan gizi keluarga.`;
      hasil=`Seluruh KPM yang hadir berhasil melakukan penarikan dana bantuan secara mandiri, tertib, dan aman. Dana yang diterima telah dipastikan sesuai dengan data bayar resmi pada sistem PKH, serta tidak ditemukan adanya praktik pungutan liar atau kendala teknis yang menghambat proses distribusi bantuan di wilayah tugas.`;
      break;
    case 2:
      umum=`Pertemuan Peningkatan Kemampuan Keluarga (P2K2) atau Family Development Session (FDS) adalah instrumen utama PKH untuk memfasilitasi perubahan perilaku jangka panjang pada Keluarga Penerima Manfaat. Melalui transfer pengetahuan yang terstruktur, KPM dibekali berbagai kecakapan hidup esensial guna membangun kemandirian mental, ekonomi, dan kesehatan keluarga agar mampu memutus rantai kemiskinan antar-generasi secara efektif.`;
      tujuan=`1. Membekali anggota Kelompok ${grp} di Desa ${desa} dengan wawasan praktis mengenai ${modul}, khususnya ${sesi}.\n2. Meningkatkan kapasitas KPM untuk mengimplementasikan pola asuh anak positif, manajemen keuangan rumah tangga efektif, serta menjaga standar gizi dan kesehatan lingkungan.\n3. Menumbuhkan motivasi kemandirian keluarga agar mampu meningkatkan kualitas taraf hidup secara mandiri tanpa ketergantungan pada bantuan sosial.`;
      narasi=`Pelaksanaan P2K2 bertempat di Desa ${desa} bersama seluruh anggota Kelompok ${grp}. Pendamping memandu jalannya sesi secara dialogis dan interaktif menggunakan Buku Pintar, Flipchart, dan pemutaran media edukasi singkat. Kegiatan diawali dengan pembukaan motivasi, penyampaian poin utama materi ${sesi}, diskusi kelompok kecil, simulasi peran (role play), serta diakhiri penyusunan rencana aksi nyata yang akan dilakukan KPM di rumah tangga masing-masing.`;
      hasil=`KPM di Kelompok ${grp} menunjukkan antusiasme tinggi dan mampu menjelaskan kembali poin utama materi ${sesi} saat evaluasi akhir sesi. Tercapainya kesepakatan komitmen harian dari setiap peserta serta terdokumentasikannya partisipasi aktif KPM sebagai pemenuhan kewajiban kehadiran dalam program PKH bulan berjalan.`;
      break;
    case 4:
      if(isPPSE){
        umum=`Kegiatan dilaksanakan melalui pendampingan intensif dengan KPM PKH terkait program Pemberdayaan Sosial dan Ekonomi (PPSE). Diberikan penjelasan mendalam mengenai tujuan, manfaat, dan mekanisme PPSE sebagai langkah strategis pengentasan kemiskinan dan pemberdayaan ekonomi keluarga secara berkelanjutan.`;
        tujuan=`1. Melakukan identifikasi dan asesmen mendalam terhadap KPM ${f.ppse_nama||"..."} yang telah menunjukkan potensi kemandirian ekonomi melalui kegiatan usaha ${f.ppse_produk||"..."}.\n2. Memberikan penguatan pemahaman program PPSE sebagai sarana peningkatan pendapatan dan kemandirian keluarga.\n3. Menyusun instrumen usulan calon peserta program PPSE yang akurat dan akuntabel guna percepatan graduasi ekonomi.`;
        narasi=`Pendamping melaksanakan kunjungan lapangan dan asesmen di kediaman KPM atas nama ${f.ppse_nama||"..."}. Fokus utama pembahasan meliputi validasi profil ekonomi keluarga, identifikasi potensi usaha ${f.ppse_produk||"..."} yang sedang dijalankan, serta penilaian kesiapan mental KPM untuk menerima pendampingan kewirausahaan lebih lanjut. Pendamping memberikan gambaran ekosistem program PPSE meliputi akses modal, penguatan manajemen usaha, dan pemasaran produk.`;
        hasil=`1. Terdata KPM atas nama ${f.ppse_nama||"..."} yang menyatakan bersedia dan antusias mengikuti program PPSE.\n2. Meningkatnya pemahaman dan motivasi KPM mengenai pentingnya pemberdayaan ekonomi menuju kemandirian finansial.\n3. Tersusunnya instrumen asesmen dan usulan KPM sebagai calon peserta program PPSE yang valid dan siap diinput ke sistem.`;
      } else {
        umum=`Usulan graduasi mandiri merupakan indikator keberhasilan tertinggi dalam pendampingan PKH yang menunjukkan peningkatan taraf hidup KPM sehingga secara sukarela menyatakan diri mampu dan bersedia melepaskan bantuan sosial pemerintah.`;
        tujuan=`1. Memfasilitasi permohonan graduasi mandiri bagi KPM ${f.ppse_nama||"..."} yang secara faktual sudah memiliki ketahanan ekonomi mandiri di wilayah Desa ${desa}.\n2. Melakukan edukasi mengenai kemuliaan status graduasi mandiri bagi keluarga yang telah sejahtera.\n3. Menjamin akurasi data kepesertaan dengan mengeluarkan KPM yang sudah mampu dari basis data penerima bantuan nasional.`;
        narasi=`Pendamping melaksanakan kunjungan edukatif kepada KPM atas nama ${f.ppse_nama||"..."} yang tercatat sebagai peserta PKH sejak tahun ${f.ppse_tahun_pkh||"..."}. Dilakukan diskusi persuasif mengenai konsep kemandirian ekonomi dan kebanggaan menjadi keluarga yang mandiri. Pendamping melakukan validasi akhir terhadap kondisi aset dan pendapatan keluarga untuk memastikan proses graduasi dilakukan secara sadar dan tanpa paksaan.`;
        hasil=`Tersusunnya draf usulan graduasi mandiri yang sah atas nama KPM ${f.ppse_nama||"..."} (kepesertaan sejak ${f.ppse_tahun_pkh||"..."}). Hal ini menjadi preseden positif bagi KPM lainnya di Desa ${desa} untuk terus berupaya meningkatkan kesejahteraan ekonomi.`;
      }
      break;
    case 8:
      umum=`Melaksanakan direktif pimpinan merupakan perwujudan responsivitas pendamping sosial terhadap instruksi strategis atau penugasan khusus yang bersifat mendesak guna merespons dinamika kebijakan di lapangan. Penugasan ini krusial untuk memastikan kebijakan strategis kementerian dapat terimplementasi secara selaras di tingkat lapangan.`;

  const numP=(no,txt)=>`<div class="doc-num-wrap"><span class="doc-num-no">${no}.</span><span class="doc-num-txt">${txt}</span></div>`;
  // Parse teks bernomor (format "1. teks\n2. teks") jadi blok hanging indent
  const parseNums=(raw)=>{
    const lines=raw.split(/\n/);
    const out=[];
    let cur=null;
    for(const ln of lines){
      const m=ln.match(/^(\d+)\.\s+(.*)/);
      if(m){ if(cur)out.push(cur); cur={no:m[1],txt:m[2]}; }
      else if(cur){ cur.txt+=' '+ln.trim(); }
      else { out.push({no:null,txt:ln}); }
    }
    if(cur)out.push(cur);

// ── EXPORT WORD ──────────────────────────────
window.exportWord=()=>{
  const name=`Laporan_RHK${S.rhk.no}_${S.form.nama}_${S.form.tgl_kegiatan}.doc`;
  const inner=document.getElementById("doc-preview");
  if(!inner){showToast("Buka tab Pratinjau dulu!",true);return;}
  const html=`<html><head><meta charset="utf-8"><style>@page{size:A4;margin:2.5cm}body{font-family:'Times New Roman',serif;font-size:${S.fontSize}pt;line-height:1.5}table{width:100%;border-collapse:collapse}td,th{border:1px solid black;padding:6px;vertical-align:top}p{margin-bottom:6pt}</style></head><body>${inner.outerHTML}</body></html>`;
  const blob=new Blob(['\ufeff',html],{type:"application/msword"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast("File Word berhasil diunduh ✓");
};

// ── FORMAT NAMA FILE ─────────────────────────
function buildFileName(ext){
  const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const nama=(S.form.nama||"Pendamping").trim();
  const rhkNo=S.rhk.no;
  // parse tanggal kegiatan (format YYYY-MM-DD)
  let tglStr="";
  if(S.form.tgl_kegiatan){
    const [y,m,d]=S.form.tgl_kegiatan.split("-").map(Number);
    tglStr=`${d} ${BULAN[m-1]} ${y}`;
  }
  // bersihkan karakter tidak valid untuk nama file
  const clean=s=>s.replace(/[/\\:*?"<>|]/g,"");
  return clean(`${nama}_RHK ${rhkNo}_${tglStr}.${ext}`);
}

// ── PRINT PDF ────────────────────────────────
window.exportPDF=()=>{
  const inner=document.getElementById("doc-preview");
  if(!inner){ S.page="preview"; render(); showToast("Buka pratinjau dulu, lalu klik Cetak PDF lagi…"); return; }
  let pw=document.getElementById("print-wrap");
  if(!pw){ pw=document.createElement("div"); pw.id="print-wrap"; pw.style.display="none"; document.body.appendChild(pw); }
  pw.innerHTML=inner.outerHTML;
  // Ubah judul halaman sementara agar nama file PDF di dialog cetak sesuai
  const prevTitle=document.title;
  document.title=buildFileName("pdf");
  setTimeout(()=>{
    window.print();
    // Kembalikan judul dan bersihkan print-wrap setelah dialog cetak selesai
    setTimeout(()=>{
      document.title=prevTitle;
      pw.innerHTML=""; // bersihkan agar foto tidak tertempel
    },1500);
  },800);
};

// ── SHARE (menu share native HP) ─────────────
window.shareReport=async()=>{
  const inner=document.getElementById("doc-preview");
  if(!inner){ S.page="preview"; render(); showToast("Buka pratinjau dulu, lalu klik Bagikan lagi…"); return; }

  const fileName=buildFileName("pdf");
  showToast("Menyiapkan PDF untuk dibagikan…");

  try{
    const opt={
      margin:0,
      filename:fileName,
      html2canvas:{scale:2,useCORS:true},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
    };
    const blob=await html2pdf().set(opt).from(inner).outputPdf("blob");
    const file=new File([blob],fileName,{type:"application/pdf"});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({
        files:[file],
        title:"Laporan RHK "+S.rhk.no,
        text:`Laporan kegiatan RHK ${S.rhk.no} — ${S.form.nama||""}`
      });
      showToast("Berhasil dibagikan ✓");
    }else if(navigator.share){
      // fallback: browser dukung share tapi tidak dukung file
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      showToast("PDF diunduh (perangkat tidak mendukung share file langsung)");
    }else{
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      showToast("PDF diunduh. Buka file untuk dibagikan manual.");
    }
  }catch(err){
    if(err && err.name==="AbortError"){ return; } // user batal share, jangan tampilkan error
    console.error(err);
    showToast("Gagal membagikan PDF",true);
  }
};

window.pickRHK=(id)=>{ const r=RHK.find(x=>x.id===id); S.rhk=r; S.form.kegiatan=r.options[0]; _narasiManual=false; autoNarrative(); S.page="edit"; render(); };

render();

// Daftarkan service worker (agar bisa di-"Install" sebagai app & jalan offline)
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
