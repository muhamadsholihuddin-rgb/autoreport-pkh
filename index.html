<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f11;--surf:#161b22;--surfhi:#1c2128;
  --bd:#21262d;--bd2:#30363d;
  --tx:#f0f6fc;--txs:#cdd9e5;--txm:#8b949e;
  --gold:#d4a853;--goldDim:rgba(212,168,83,0.12);--goldBd:rgba(212,168,83,0.28);
}
body{
  background:var(--bg);color:var(--tx);
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  min-height:100vh;font-size:14px;
  -webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:99px}

/* Element Form yang Mudah Ditotok di Layar HP */
input,select,textarea{
  font-family:inherit;background:#0d1117;border:1px solid var(--bd2);
  color:var(--tx);border-radius:10px;padding:11px 14px;font-size:14px;
  outline:none;width:100%;transition:border-color .15s, box-shadow .15s;
  min-height:44px;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--goldDim)}
select{appearance:none;padding-right:36px;cursor:pointer}
select option{background:#161b22;color:var(--tx)}
textarea{resize:vertical;line-height:1.6;min-height:90px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}
input[type=range]{accent-color:var(--gold);cursor:pointer;min-height:auto}

label.photo-slot{
  display:block;position:relative;background:#0d1117;border:1.5px dashed var(--bd2);
  border-radius:10px;cursor:pointer;overflow:hidden;aspect-ratio:16/9;
  transition:border-color .15s;
}
label.photo-slot:hover{border-color:var(--gold)}
label.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
label.photo-slot .ph-inner{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--txm);
}
label.photo-slot .ph-del{
  position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);border:none;
  color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;
  font-size:18px;display:flex;align-items:center;justify-content:center;
  line-height:1;z-index:2;
}
label.kop-slot{aspect-ratio:5/1}

.card{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:20px}
.sec-hd{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px}
.lbl{font-size:11px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:14px}
.divider{height:1px;background:var(--bd);margin:16px 0}

/* Tombol Ramah Sentuhan (Touch-Friendly) */
.btn-gold{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--gold),#8a5c10);color:#0d0f11;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .15s;min-height:44px;white-space:nowrap;
}
.btn-gold:active{transform:scale(.98);opacity:.9}

.btn-out{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--bd2);
  background:transparent;color:var(--txs);font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;min-height:44px;white-space:nowrap;
}
.btn-out:active{background:rgba(255,255,255,.05)}

.btn-ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:8px;border:1px solid var(--goldBd);
  background:var(--goldDim);color:var(--gold);font-size:11px;
  font-weight:700;cursor:pointer;font-family:inherit;min-height:36px;
}

.tab-btn{
  display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;
  border:none;cursor:pointer;font-family:inherit;background:transparent;
  color:var(--txm);font-size:12px;font-weight:600;transition:all .15s;
}
.tab-btn.active{background:var(--goldDim);color:var(--gold)}

.side-tab{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;
  border-radius:10px;border:none;cursor:pointer;background:transparent;
  color:var(--txm);font-size:12px;font-weight:600;text-align:left;
  transition:all .15s;border-left:3px solid transparent;font-family:inherit;
}
.side-tab.active{background:var(--goldDim);color:var(--gold);border-left-color:var(--gold)}
.side-tab:hover{color:var(--txs)}

.rhk-card{
  background:var(--surf);border:1px solid var(--bd);border-radius:16px;
  padding:18px;cursor:pointer;transition:all .16s;
}
.rhk-card:hover,.rhk-card.active{border-color:var(--gold);background:var(--surfhi)}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.fi{animation:fadein .22s ease}
.spin-ico{display:inline-flex;width:16px;height:16px;animation:spin .8s linear infinite}

.toast{

  white-space:nowrap;max-width:90vw;
}
.toast.err{border-color:#f85149;color:#f85149}

<script type="module">
// ── REGISTER SERVICE WORKER (PWA) ──────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      const CACHE_NAME = 'autoreport-pkh-v2';
      self.addEventListener('install', (e) => self.skipWaiting());
      self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
      self.addEventListener('fetch', (e) => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  });
}

// ── DATA MASTER PKH & RHK ───────────────────
const P2K2 = {
  "Modul 1: Pendidikan & Pengasuhan Anak":["Sesi 1: Menjadi Orang Tua yang Lebih Baik","Sesi 2: Memahami Perilaku Anak","Sesi 3: Cara Anak Usia Dini Belajar","Sesi 4: Membantu Anak Sukses di Sekolah"],
  "Modul 2: Ekonomi & Keuangan":["Sesi 5: Mengelola Keuangan Keluarga","Sesi 6: Cermat Meminjam dan Menabung","Sesi 7: Memulai Usaha"],
  "Modul 3: Kesehatan & Gizi":["Sesi 8: Gizi & Layanan Ibu Hamil","Sesi 9: Gizi untuk Ibu Menyusui & Balita","Sesi 10: Kesakitan Anak & Kebersihan Lingkungan"],
  "Modul 4: Perlindungan Anak":["Sesi 11: Pencegahan Kekerasan pada Anak","Sesi 12: Penelantaran & Eksploitasi Anak"],
  "Modul 5: Kesejahteraan Sosial":["Sesi 13: Pelayanan Penyandang Disabilitas Berat","Sesi 14: Kesejahteraan Lanjut Usia"]
};

const RHK = [
  {id:1,no:1,title:"Penyaluran Bansos PKH",sub:"Tepat Sasaran & Jumlah",options:["Edukasi & sosialisasi pencairan tunai/non-tunai","Supervisi permasalahan bantuan sosial","Monitoring/Pemantauan penyaluran bantuan sosial"]},
  {id:2,no:2,title:"Pertemuan P2K2",sub:"Sesuai Ketentuan",options:["Melaksanakan Pertemuan P2K2 (FDS)"]},
  {id:3,no:3,title:"Verifikasi Komitmen",sub:"& Pendampingan KPM",options:["Verifikasi komitmen pendidikan, kesehatan & kesos","Pendampingan, mediasi, dan fasilitasi KPM PKH"]},
  {id:4,no:4,title:"Usulan Graduasi & PPSE",sub:"Pemberdayaan Ekonomi",options:["Usulan KPM graduasi mandiri","Pemberdayaan PPSE (usulan PPSE)"]},
  {id:5,no:5,title:"VerVal & Pemutakhiran",sub:"Data KPM",options:["Proses bisnis PKH (VerVal)","Pemutakhiran data anggota KPM"]},
  {id:6,no:6,title:"Respon Kasus Adaptif",sub:"Cepat & Terukur",options:["Respon kasus/pengaduan/kebencanaan/kerentanan"]},
  {id:7,no:7,title:"Laporan Bulanan",sub:"Analisis & Dokumentasi",options:["Laporan bulanan pelaksanaan PKH & laporan lainnya"]},
  {id:8,no:8,title:"Direktif Pimpinan",sub:"Sesuai Penugasan",options:["TLHP (Tindak Lanjut Hasil Pemeriksaan)","Sosialisasi kebijakan","Rapat Koordinasi","Tugas lainnya"]},
  {id:9,no:9,title:"Berita Baik Kemensos",sub:"Komunikasi Publik",options:["Penyebaran Berita Baik di Media Sosial"]}
];

// ── PENAMAPALAN FILE (FORMAT: nama_rhk berapa_hari_tgl_bulan_tahun.pdf) ────────
const BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const HARI_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

const toDate = d => {
  if(!d) return "";
  const parts = d.split("-");
  if(parts.length === 3) {
    const dt = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    return new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(dt);
  }
  return d;
};

const lastWorkday = () => {
  const n=new Date(), ld=new Date(n.getFullYear(),n.getMonth()+1,0);
  while(ld.getDay()===0 || ld.getDay()===6) ld.setDate(ld.getDate()-1);
  return new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"long",year:"numeric"}).format(ld);
};

const today = () => new Date().toISOString().split("T")[0];

function buildFileName(ext) {
  let nama = (S.form.nama || "Pendamping").trim();
  const rhkNo = S.rhk ? S.rhk.no : 1;
  
  let hariStr = "", tglStr = "", bulanStr = "", tahunStr = "";
  if (S.form.tgl_kegiatan) {
    const parts = S.form.tgl_kegiatan.split("-");
    if (parts.length === 3) {
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      const dateObj = new Date(y, m - 1, d);
      hariStr = HARI_ID[dateObj.getDay()] || "";
      tglStr = String(d);
      bulanStr = BULAN_ID[m - 1] || "";
      tahunStr = String(y);
    }
  }
  
  if (!hariStr) {
    const todayObj = new Date();
    hariStr = HARI_ID[todayObj.getDay()];
    tglStr = String(todayObj.getDate());
    bulanStr = BULAN_ID[todayObj.getMonth()];
    tahunStr = String(todayObj.getFullYear());
  }

  const clean = s => s.replace(/[/\\:*?"<>|]/g, "").replace(/\s+/g, "_").replace(/_+/g, "_").replace(/^_+|_+$/g, "");
  
  const rawName = `${nama}_RHK${rhkNo}_${hariStr}_${tglStr}_${bulanStr}_${tahunStr}`;
  return `${clean(rawName)}.${ext}`;
}

// ── DASAR KEGIATAN ──────────────────────────
function getDasar(rhk, f, modul, sesi) {
  const base = [
    `Rencana Hasil Kerja (RHK) ASN PPPK Dit. PSNK terkait ${rhk.title} — ${rhk.sub}.`,
    `Tugas pokok ASN PPPK Dit. PSNK di wilayah tugas guna menjamin keberlangsungan program perlindungan sosial nasional.`
  ];
  const sp = {
    1:`Data Bayar dan Monitoring Penyaluran Bantuan Sosial yang bersumber dari SIKMA/Omspan periode berjalan sebagai acuan distribusi tepat sasaran.`,
    2:`Kurikulum Modul P2K2 Direktorat Jaminan Sosial Keluarga — ${modul}: ${sesi} — sebagai pedoman pelaksanaan pertemuan.`,
    3:`Sistem Verifikasi Komitmen (VerKom) yang terintegrasi pada aplikasi SIKMA guna menjamin bantuan tepat syarat.`,
    4:f.kegiatan?.toLowerCase().includes("ppse")?`Instrumen Asesmen KPM Potensi Graduasi dan Formulir Pendaftaran Program PPSE Kemensos RI.`:`Pedoman Graduasi Mandiri PKH dan Instrumen Asesmen Kesiapan Ekonomi Keluarga guna akurasi data kepesertaan.`,
    5:`Data Pembaruan DTSEN yang bersumber dari SIKMA guna menjamin akuntabilitas data penerima bantuan sosial nasional.`,
    6:`Mekanisme Respons Cepat Kasus Sosial PKH dan prosedur penanganan pengaduan yang ditetapkan Kemensos RI.`,
    7:`Format Laporan Bulanan Pelaksanaan PKH yang ditetapkan Direktorat PSNK sebagai instrumen monitoring kinerja periodik.`,
    8:`Instruksi strategis dan direktif pimpinan Direktorat PSNK Kemensos RI yang bersifat mengikat dan memerlukan tindak lanjut segera.`,
    9:`Panduan Komunikasi Publik Kemensos RI melalui kanal digital resmi.`
  };
  return [...base, sp[rhk.no]||sp[9]];
}

// ── BUILDER NARASI AUTOMATIS ─────────────────
let _narasiManual = false;

function buildNarrative(rhk, f, modul, sesi) {
  const desa=f.desa||"...", grp=f.kelompok||"...", sasaran=f.sasaran||"...", act=f.kegiatan||"";
  const isPPSE = act.toLowerCase().includes("ppse");
  let umum,tujuan,narasi,hasil;
  switch(rhk.no){
    case 1:
      umum=`Penyaluran bantuan sosial merupakan pilar strategis dalam menjaga jaring pengaman sosial nasional bagi masyarakat prasejahtera di Indonesia. Dalam kerangka Program Keluarga Harapan (PKH), ketepatan jumlah dan waktu penyaluran sangat krusial untuk menjaga daya beli serta memenuhi kebutuhan dasar Keluarga Penerima Manfaat (KPM) secara akuntabel dan transparan sesuai regulasi Kemensos RI.`;
      tujuan=`1. Meningkatkan literasi finansial KPM mengenai mekanisme transaksi bantuan sosial melalui mesin ATM maupun agen perbankan resmi di wilayah Desa ${desa}.\n2. Memastikan KPM menerima bantuan sesuai komponen hak tanpa adanya potongan ilegal dari pihak manapun.\n3. Mengedukasi KPM agar senantiasa menjaga kerahasiaan PIN Kartu KKS masing-masing guna menghindari penyalahgunaan dana.`;
      narasi=`Pendamping sosial melaksanakan pendampingan teknis dan edukasi pencairan bantuan di lokasi transaksi secara intensif. Diberikan arahan komprehensif mengenai tata cara penggunaan kartu KKS yang benar, membantu KPM yang mengalami kendala teknis pada mesin transaksi, serta melakukan verifikasi saldo untuk memastikan dana telah masuk ke rekening masing-masing KPM. Pendamping juga memberikan motivasi agar bantuan digunakan secara bijak untuk kebutuhan prioritas seperti pendidikan anak dan asupan gizi keluarga.`;
      hasil=`Seluruh KPM yang hadir berhasil melakukan penarikan dana bantuan secara mandiri, tertib, dan aman. Dana yang diterima telah dipastikan sesuai dengan data bayar resmi pada sistem PKH, serta tidak ditemukan adanya praktik pungutan liar atau kendala teknis yang menghambat proses distribusi bantuan di wilayah tugas.`;
      break;
    case 2:
      umum=`Pertemuan Peningkatan Kemampuan Keluarga (P2K2) atau Family Development Session (FDS) adalah instrumen utama PKH untuk memfasilitasi perubahan perilaku jangka panjang pada Keluarga Penerima Manfaat. Melalui transfer pengetahuan yang terstruktur, KPM dibekali berbagai kecakapan hidup esensial guna membangun kemandirian mental, ekonomi, dan kesehatan keluarga agar mampu memutus rantai kemiskinan antar-generasi secara efektif.`;
      tujuan=`1. Membekali anggota Kelompok ${grp} di Desa ${desa} dengan wawasan praktis mengenai ${modul}, khususnya ${sesi}.\n2. Meningkatkan kapasitas KPM untuk mengimplementasikan pola asuh anak positif, manajemen keuangan rumah tangga efektif, serta menjaga standar gizi dan kesehatan lingkungan.\n3. Menumbuhkan motivasi kemandirian keluarga agar mampu meningkatkan kualitas taraf hidup secara mandiri tanpa ketergantungan pada bantuan sosial.`;
      narasi=`Pelaksanaan P2K2 bertempat di Desa ${desa} bersama seluruh anggota Kelompok ${grp}. Pendamping memandu jalannya sesi secara dialogis dan interaktif menggunakan Buku Pintar, Flipchart, dan pemutaran media edukasi singkat. Kegiatan diawali dengan pembukaan motivasi, penyampaian poin utama materi ${sesi}, diskusi kelompok kecil, simulasi peran (role play), serta diakhiri penyusunan rencana aksi nyata yang akan dilakukan KPM di rumah tangga masing-masing.`;
      hasil=`KPM di Kelompok ${grp} menunjukkan antusiasme tinggi dan mampu menjelaskan kembali poin utama materi ${sesi} saat evaluasi akhir sesi. Tercapainya kesepakatan komitmen harian dari setiap peserta serta terdokumentasikannya partisipasi aktif KPM sebagai pemenuhan kewajiban kehadiran dalam program PKH bulan berjalan.`;
      break;
    case 4:
      if(isPPSE){
        umum=`Kegiatan dilaksanakan melalui pendampingan intensif dengan KPM PKH terkait program Pemberdayaan Sosial dan Ekonomi (PPSE). Diberikan penjelasan mendalam mengenai tujuan, manfaat, dan mekanisme PPSE sebagai langkah strategis pengentasan kemiskinan dan pemberdayaan ekonomi keluarga secara berkelanjutan.`;
        tujuan=`1. Melakukan identifikasi dan asesmen mendalam terhadap KPM ${f.ppse_nama||"..."} yang telah menunjukkan potensi kemandirian ekonomi melalui kegiatan usaha ${f.ppse_produk||"..."}.\n2. Memberikan penguatan pemahaman program PPSE sebagai sarana peningkatan pendapatan dan kemandirian keluarga.\n3. Menyusun instrumen usulan calon peserta program PPSE yang akurat dan akuntabel guna percepatan graduasi ekonomi.`;
        narasi=`Pendamping melaksanakan kunjungan lapangan dan asesmen di kediaman KPM atas nama ${f.ppse_nama||"..."}. Fokus utama pembahasan meliputi validasi profil ekonomi keluarga, identifikasi potensi usaha ${f.ppse_produk||"..."} yang sedang dijalankan, serta penilaian kesiapan mental KPM untuk menerima pendampingan kewirausahaan lebih lanjut. Pendamping memberikan gambaran ekosistem program PPSE meliputi akses modal, penguatan manajemen usaha, dan pemasaran produk.`;
        hasil=`1. Terdata KPM atas nama ${f.ppse_nama||"..."} yang menyatakan bersedia dan antusias mengikuti program PPSE.\n2. Meningkatnya pemahaman dan motivasi KPM mengenai pentingnya pemberdayaan ekonomi menuju kemandirian finansial.\n3. Tersusunnya instrumen asesmen dan usulan KPM sebagai calon peserta program PPSE yang valid dan siap diinput ke sistem.`;
      } else {
        umum=`Usulan graduasi mandiri merupakan indikator keberhasilan tertinggi dalam pendampingan PKH yang menunjukkan peningkatan taraf hidup KPM sehingga secara sukarela menyatakan diri mampu dan bersedia melepaskan bantuan sosial pemerintah.`;
        tujuan=`1. Memfasilitasi permohonan graduasi mandiri bagi KPM ${f.ppse_nama||"..."} yang secara faktual sudah memiliki ketahanan ekonomi mandiri di wilayah Desa ${desa}.\n2. Melakukan edukasi mengenai kemuliaan status graduasi mandiri bagi keluarga yang telah sejahtera.\n3. Menjamin akurasi data kepesertaan dengan mengeluarkan KPM yang sudah mampu dari basis data penerima bantuan nasional.`;
        narasi=`Pendamping melaksanakan kunjungan edukatif kepada KPM atas nama ${f.ppse_nama||"..."} yang tercatat sebagai peserta PKH sejak tahun ${f.ppse_tahun_pkh||"..."}. Dilakukan diskusi persuasif mengenai konsep kemandirian ekonomi dan kebanggaan menjadi keluarga yang mandiri. Pendamping melakukan validasi akhir terhadap kondisi aset dan pendapatan keluarga untuk memastikan proses graduasi dilakukan secara sadar dan tanpa paksaan.`;
        hasil=`Tersusunnya draf usulan graduasi mandiri yang sah atas nama KPM ${f.ppse_nama||"..."} (kepesertaan sejak ${f.ppse_tahun_pkh||"..."}). Hal ini menjadi preseden positif bagi KPM lainnya di Desa ${desa} untuk terus berupaya meningkatkan kesejahteraan ekonomi.`;
      }
      break;
    case 8:
      umum=`Melaksanakan direktif pimpinan merupakan perwujudan responsivitas pendamping sosial terhadap instruksi strategis atau penugasan khusus yang bersifat mendesak guna merespons dinamika kebijakan di lapangan. Penugasan ini krusial untuk memastikan kebijakan strategis kementerian dapat terimplementasi secara selaras di tingkat lapangan.`;
      tujuan=`1. Membangun sinergi koordinasi bersama ${sasaran} guna memastikan penugasan terkait ${act} terlaksana secara tepat waktu, efektif, dan akuntabel.\n2. Menyamakan persepsi langkah kerja di lapangan dan meminimalkan hambatan birokrasi demi kelancaran pelayanan sosial.\n3. Menjamin setiap instruksi pimpinan dapat diterjemahkan ke dalam aksi nyata yang memberikan manfaat langsung bagi KPM di wilayah dampingan.`;
      narasi=`Pendamping melaksanakan audiensi dan rapat koordinasi bersama ${sasaran} pada lokasi yang telah disepakati. Fokus pembahasan diarahkan pada penjabaran teknis instruksi direktif pimpinan, pemetaan potensi hambatan di lapangan, serta perumusan kerangka solusi integratif guna percepatan penyelesaian tugas secara tuntas. Pendamping menyampaikan data pendukung serta laporan progres terkini untuk mendukung proses pengambilan keputusan strategis.`;
      hasil=`Tercapainya kesepahaman langkah strategis dan komitmen kerja sama yang solid antara pendamping sosial dengan pihak ${sasaran}. Diperolehnya rencana tindak lanjut (RTL) yang konkret serta terjalinnya pola komunikasi sektoral yang lebih efisien.`;
      break;
    case 9:
      umum=`Penyebaran Berita Baik melalui media sosial merupakan strategi komunikasi publik modern untuk menyebarluaskan dampak positif program perlindungan sosial kepada masyarakat luas secara masif. Hal ini bertujuan untuk membangun kepercayaan publik terhadap kinerja pemerintah serta menginspirasi masyarakat mengenai transformasi kemandirian sosial KPM PKH.`;
      tujuan=`1. Mendokumentasikan dan mempublikasikan narasi positif mengenai keberhasilan program pendampingan sosial di lapangan melalui platform komunikasi publik resmi.\n2. Memperkuat citra positif lembaga di mata masyarakat serta memberikan apresiasi visual terhadap capaian kemandirian ekonomi KPM.\n3. Menyediakan sumber informasi publik yang autentik dan inspiratif mengenai manfaat nyata PKH bagi upaya pengentasan kemiskinan di wilayah dampingan.`;
      narasi=`Pendamping menyusun materi publikasi digital berupa foto dokumentasi aksi lapangan yang humanis atau testimoni kemajuan anggota KPM dampingan yang telah berhasil merintis kemandirian ekonomi. Pendamping merangkai narasi berita yang persuasif dan informatif dengan tetap berpegang pada standar komunikasi publik kementerian. Konten kemudian diunggah dengan menandai Akun Media Sosial Kemensos RI secara profesional.`;

      break;
    default:
      umum=`Laporan ini disusun sebagai pertanggungjawaban pelaksanaan tugas harian ASN PPPK guna memastikan program perlindungan sosial di wilayah dampingan berjalan tepat sasaran, akuntabel, dan transparan.`;
      tujuan=`1. Memastikan seluruh intervensi program di wilayah Desa ${desa} berjalan sesuai pedoman teknis kementerian.\n2. Melakukan monitoring rutin terhadap pemenuhan hak dasar KPM di bidang pendidikan, kesehatan, dan kesejahteraan sosial.\n3. Menyediakan data lapangan yang akurat guna mendukung proses pengambilan kebijakan program.`;
      narasi=`Pendamping melaksanakan kegiatan harian ${act} guna mengidentifikasi kondisi riil lapangan serta memberikan layanan responsif bagi KPM sesuai standar operasional yang ditetapkan. Pendamping melakukan interaksi langsung dengan masyarakat, menyerap aspirasi, serta memberikan solusi terhadap kendala yang ditemui.`;
      hasil=`Kegiatan terlaksana secara kondusif dan diperolehnya data akurat guna mendukung pemutakhiran status kepesertaan jaminan sosial keluarga dampingan. Terjaminnya pelayanan sosial bagi KPM di wilayah Desa ${desa} serta tersedianya bahan laporan kinerja harian yang valid.`;
  }
  return {umum,tujuan,narasi,hasil};
}

function saveProfile(){
  try{
    const p={}; PROFILE_KEYS.forEach(k=>p[k]=S.form[k]||"");
    localStorage.setItem("autoreport_profile", JSON.stringify(p));
    localStorage.setItem("autoreport_desalist", JSON.stringify(S.desaList||[]));
    localStorage.setItem("autoreport_profile_done","1");
  }catch(e){}
}
function loadProfile(){
  try{
    const raw=localStorage.getItem("autoreport_profile");
    if(raw){ const p=JSON.parse(raw); PROFILE_KEYS.forEach(k=>{ if(p[k]) S.form[k]=p[k]; }); }
    const rawDesa=localStorage.getItem("autoreport_desalist");
    if(rawDesa){ const dl=JSON.parse(rawDesa); if(Array.isArray(dl)) S.desaList=dl; }
    return localStorage.getItem("autoreport_profile_done")==="1";
  }catch(e){ return false; }
}

function docHTML(fs){
  const f=S.form, rhk=S.rhk, modul=S.modul, sesi=S.sesi;

// ── EXPORT WORD (.doc) ────────────────────────
window.exportWord=()=>{
  const name=buildFileName("doc");
  const inner=document.getElementById("doc-preview");
  if(!inner){showToast("Buka tab Pratinjau dulu!",true);return;}
  const html=`<html><head><meta charset="utf-8"><style>@page{size:A4;margin:2.5cm}body{font-family:'Times New Roman',serif;font-size:${S.fontSize}pt;line-height:1.5}table{width:100%;border-collapse:collapse}td,th{border:1px solid black;padding:6px;vertical-align:top}p{margin-bottom:6pt}</style></head><body>${inner.outerHTML}</body></html>`;
  const blob=new Blob(['\ufeff',html],{type:"application/msword"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast("File Word berhasil diunduh ✓");
};

// ── SHARE PDF NATIVE (Web Share API) ─────────
window.sharePDF = async function() {
  if (S.shareLoading) return;
  S.shareLoading = true;
  render();

  try {
    // Selalu bangun salinan tersembunyi berlebar A4 penuh (210mm),
    // supaya hasil capture TIDAK terpengaruh lebar layar/scroll horizontal
    // pada layar HP (penyebab teks & foto terpotong sebelumnya).
    const PDF_PX_WIDTH = 794; // ~210mm pada 96dpi
    const tempContainer = document.createElement("div");
    tempContainer.id = "temp-pdf-render";
    tempContainer.style.position = "fixed";
    tempContainer.style.left = "0";
    tempContainer.style.top = "0";
    tempContainer.style.width = PDF_PX_WIDTH + "px";
    tempContainer.style.zIndex = "-1";
    tempContainer.style.opacity = "0";
    tempContainer.style.pointerEvents = "none";
    tempContainer.innerHTML = docHTML(S.fontSize);
    document.body.appendChild(tempContainer);
    const prev = tempContainer.querySelector("#doc-preview");
    prev.style.width = PDF_PX_WIDTH + "px";
    prev.style.boxShadow = "none";
    prev.style.padding = "0"; // margin diatur lewat opsi html2pdf di bawah, supaya berulang di SETIAP halaman (bukan cuma di awal/akhir dokumen)

    const fileName = buildFileName("pdf");
    showToast("Memproses file PDF untuk dibagikan...");

    const opt = {
      margin:       25, // 2.5cm di semua sisi, diterapkan ulang di tiap halaman
      filename:     fileName,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  {
        scale: 2, useCORS: true, logging: false,
        windowWidth: PDF_PX_WIDTH, width: PDF_PX_WIDTH,
        scrollX: 0, scrollY: 0
      },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak:    { mode: ['css', 'legacy'], avoid: ['img', '.doc-sec', '.info-row'] }
    };

    const pdfBlob = await html2pdf().set(opt).from(prev).output('blob');
    tempContainer.remove();

    const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      await navigator.share({
        title: fileName,
        text: `Laporan Harian PKH — RHK ${S.rhk.no}`,
        files: [pdfFile]
      });
      showToast("Laporan berhasil dibagikan ✓");
    } else if (navigator.share) {
      await navigator.share({
        title: fileName,
        text: `Laporan Harian PKH: ${fileName}`
      });
      showToast("Menu share berhasil dibuka ✓");
    } else {
      const url = URL.createObjectURL(pdfBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Fitur Share tidak didukung di browser ini, PDF diunduh otomatis ✓");
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error(err);
      showToast("Gagal membagikan PDF: " + (err.message || err), true);
    }
  } finally {
    S.shareLoading = false;
    render();
  }
};

            <div class="sec-hd">${ico("img")} Foto & Media</div>
            <div class="fld">
              <div class="row2">${photoSlot("kop","Kop Surat","5/1")}${photoSlot("ttd","Tanda Tangan","5/1")}</div>
              ${photoSlot("f1","Foto Utama (Lampiran 1)")}
              ${photoSlot("f2","Foto Pendukung 1 (Lampiran 2)")}
              ${photoSlot("f3","Foto Pendukung 2 (Lampiran 3)")}
            </div>
          </div>

          <!-- CARD NARASI -->
          <div id="sec-narasi" class="card">
            <div class="sec-hd" style="justify-content:space-between">
              <span style="display:flex;align-items:center;gap:8px">${ico("txt")} Narasi Laporan</span>
              <button class="btn-ghost" onclick="refill()">${ico("ref",12)} Auto-Isi Ulang</button>
            </div>
            <div class="fld">
              ${ta("Pendahuluan Umum","umum",4)}
              ${ta("Maksud & Tujuan","tujuan",5)}
              ${ta("Narasi Kegiatan","narasi",5)}
              ${ta("Hasil yang Dicapai","hasil",5)}
              <div class="divider"></div>
              <p class="lbl" style="color:var(--txm)">Dasar Kegiatan (Otomatis per RHK)</p>
              <div style="background:#0d1117;border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px">
                ${dasar.map((d,i)=>`<div style="display:flex;gap:10px;align-items:flex-start"><span style="color:var(--gold);font-weight:700;font-size:12px;min-width:18px;padding-top:1px">${i+1}.</span><span style="font-size:12px;color:var(--txs);line-height:1.6">${escHtml(d)}</span></div>`).join("")}
              </div>
            </div>
          </div>

        </div>
        `:""}

        ${S.page==="preview"?`
        <!-- TAB PREVIEW DOKUMEN -->
        <div class="fi" style="flex:1;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1000px;margin:0 auto">
          
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-wrap:wrap;gap:12px">
            <div>
              <p style="font-weight:700;font-size:15px">Pratinjau Dokumen A4</p>
              <p style="font-size:11px;color:var(--txm);margin-top:2px">RHK ${rhk.no}: ${rhk.title}</p>
            </div>

            <!-- AKSI PRATINJAU -->
            <button class="btn-gold" onclick="sharePDF()" ${S.shareLoading?"disabled":""} style="background:linear-gradient(135deg,#25D366,#128C7E);color:#fff">
              ${S.shareLoading?`<span class="spin-ico">${IC.spin}</span>`:`${ico("share",14)} Bagikan`}
            </button>
          </div>

          <!-- DOKUMEN A4 CONTAINER -->
          <div id="doc-preview-wrapper">
            ${docHTML(S.fontSize)}
          </div>
        </div>
        `:""}

        ${S.page==="rhk"?`
        <!-- TAB DAFTAR RHK -->
        <div class="fi" style="width:100%;max-width:1000px;margin:0 auto">
          <div style="margin-bottom:20px">
            <h1 style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:6px">Daftar Rencana Hasil Kerja (RHK)</h1>
            <p style="color:var(--txm);font-size:13px">Pilih RHK untuk menyesuaikan narasi dan instrumen laporan harian secara otomatis.</p>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">
            ${RHK.map(r=>`
            <div class="rhk-card ${rhk.id===r.id?"active":""}" onclick="pickRHK(${r.id})">
              ${rhk.id===r.id?`<div style="float:right;background:var(--goldDim);border:1px solid var(--goldBd);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--gold)">${ico("chk",14)}</div>`:""}
              <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px">
                <div style="width:42px;height:42px;background:var(--goldDim);border:1px solid var(--goldBd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--gold);flex-shrink:0;font-family:'Playfair Display',serif">${r.no}</div>
                <div><p style="font-size:14px;font-weight:700;line-height:1.3;margin-bottom:3px">${r.title}</p><p style="font-size:11px;color:var(--txm)">${r.sub}</p></div>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                ${r.options.map(o=>`<div style="display:flex;gap:8px;background:#0d1117;border-radius:8px;padding:8px 10px"><div style="width:5px;height:5px;background:var(--gold);border-radius:50%;flex-shrink:0;margin-top:6px"></div><span style="font-size:12px;color:var(--txs);line-height:1.4">${escHtml(o)}</span></div>`).join("")}
              </div>
              <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between">
                <span style="font-size:11px;color:var(--txm)">${r.options.length} Pilihan Kegiatan</span>
                <span style="font-size:12px;color:var(--gold);font-weight:700">Pilih RHK ›</span>
              </div>
            </div>`).join("")}
          </div>
        </div>
        `:""}

      </main>
    </div>

    <!-- NAVBAR BAWAH UNTUK HP -->
    <nav style="position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,17,.98);border-top:1px solid var(--bd);padding:8px 12px;display:flex;justify-content:space-around;align-items:center;z-index:300;backdrop-filter:blur(16px)" id="mob-nav">
      <button onclick="setPage('edit')" style="display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:${S.page==="edit"?"var(--gold)":"var(--txm)"}">
        ${ico("txt",20)}<span style="font-size:10px;font-weight:700">EDIT</span>
      </button>
      <button onclick="setPage('preview')" style="display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:${S.page==="preview"?"var(--gold)":"var(--txm)"}">
        ${ico("eye",20)}<span style="font-size:10px;font-weight:700">PRATINJAU</span>
      </button>
      <button onclick="setPage('rhk')" style="display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:${S.page==="rhk"?"var(--gold)":"var(--txm)"}">
        ${ico("grid",20)}<span style="font-size:10px;font-weight:700">RHK</span>
      </button>
      <button onclick="sharePDF()" style="display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:#25D366">
        ${ico("share",20)}<span style="font-size:10px;font-weight:700">BAGIKAN</span>
      </button>
    </nav>

  </div>
  <div id="toast" style="display:none"></div>
  `;

  // Bind Form Inputs & Listeners
  document.querySelectorAll(".form-inp").forEach(el=>{
    el.addEventListener("input",e=>setQuiet(e.target.dataset.key,e.target.value));
  });
  document.querySelectorAll(".form-ta").forEach(el=>{
    el.addEventListener("input",e=>setQuiet(e.target.dataset.key,e.target.value));
  });
  document.querySelectorAll(".form-sel").forEach(el=>{
    el.addEventListener("change",e=>set(e.target.dataset.key,e.target.value));
  });
  document.querySelector(".rhk-sel")?.addEventListener("change",e=>{
    const r=RHK.find(x=>x.id===parseInt(e.target.value));
    S.rhk=r; S.form.kegiatan=r.options[0]; autoNarrative(); render();
  });
  document.querySelector(".keg-sel")?.addEventListener("change",e=>{
    S.form.kegiatan=e.target.value; autoNarrative(); render();
  });
  document.querySelector(".modul-sel")?.addEventListener("change",e=>{
    S.modul=e.target.value; S.sesi=P2K2[S.modul][0]; autoNarrative(); render();
  });
  document.querySelector(".sesi-sel")?.addEventListener("change",e=>{
    S.sesi=e.target.value; autoNarrative(); render();
  });
  document.querySelector(".desa-sel")?.addEventListener("change",e=>{
    S.form.desa=e.target.value; S.form.kelompok=""; autoNarrative(); render();
  });
  document.querySelector(".kelompok-sel")?.addEventListener("change",e=>{
    S.form.kelompok=e.target.value; autoNarrative(); render();
  });
}

window.refill=()=>{ _narasiManual=false; autoNarrative(); render(); showToast("Narasi diperbarui otomatis ✓"); };
window.pickRHK=(id)=>{ const r=RHK.find(x=>x.id===id); S.rhk=r; S.form.kegiatan=r.options[0]; _narasiManual=false; autoNarrative(); S.page="edit"; render(); };

render();
</script>
</body>
</html>
